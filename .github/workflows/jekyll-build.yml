name: Jekyll Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.1'
        bundler-cache: true

    - name: Verify publication catalog matches registry
      run: |
        python3 scripts/sync_publications.py
        git diff --exit-code -- _data/deliverables.json _data/publication_reconciliation.json

    - name: Build jekyll site
      run: bundle exec jekyll build --future
